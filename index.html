<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>OpenRice Pay Quotation</title>
<link rel="icon" type="image/png" href="./openrice-pay-logo.png"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--ink:#202a63;--accent:#c64b3c;--success:#2c7a55;--soft:#f5f6f9;--line:#d9dee8;--muted:#647083}
*{box-sizing:border-box}html,body{margin:0;background:#eef0f4;font-family:IBM Plex Sans,sans-serif;color:#1f2933}
button,input{font:inherit}button{cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.logo{height:44px}.lang{padding:8px 14px;border:1px solid var(--ink);background:#fff;font-weight:700}
.sheet{background:#fff;border:1px solid var(--line);box-shadow:0 16px 40px rgba(25,37,77,.12)}
.head{display:flex;justify-content:space-between;gap:20px;padding:28px 32px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:28px;color:#141a43}.meta{color:var(--muted);font-size:12px;text-align:right}
.hero{display:grid;grid-template-columns:1fr 240px;gap:20px;padding:24px 32px;background:var(--soft)}
.box{padding:16px;color:#fff;background:var(--success)}.box.bad{background:var(--accent)}.box b{display:block;font-size:32px;margin:6px 0}
.pad{padding:24px 32px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.g2{grid-template-columns:1fr 1fr;margin-top:10px}
label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}input{padding:8px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;margin-top:14px}th{background:var(--ink);color:#fff;text-align:left;padding:8px}td{padding:8px;border-bottom:1px solid var(--line)}
.btn{border:0;background:var(--accent);color:#fff;padding:10px 14px;font-weight:700}
.card{border:1px solid var(--line);margin-top:12px}.card h3{margin:0;padding:10px 12px;background:#f7f8fb;font-size:14px}
.or{background:#fdf6f4}.save{color:var(--success);font-size:22px}.note{padding:16px 32px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}
@media(max-width:800px){.hero,.grid,.g2{grid-template-columns:1fr}.head{flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <img class="logo" src="./openrice-pay-logo.png" alt="OpenRice Pay"/>
    <button class="lang" id="langBtn" type="button">ENG</button>
  </div>
  <div class="sheet" id="sheet">
    <div class="head">
      <div>
        <div style="color:#c64b3c;font-size:11px;letter-spacing:.16em;font-weight:700">OPENRICE PAY</div>
        <h1 id="title">Professional Payment Quotation</h1>
      </div>
      <div class="meta">
        <div style="color:#c64b3c;font-size:22px;font-weight:700">QUOTATION</div>
        <div id="metaDate"></div>
        <div id="metaSales"></div>
      </div>
    </div>
    <div class="hero">
      <div>
        <h2 id="heroTitle" style="margin:0">Rate comparison</h2>
        <p id="heroDesc" style="color:#647083"></p>
        <div id="path" style="font-size:20px"></div>
      </div>
      <div class="box" id="saveBox"><span id="saveLabel">Annual saving</span><b id="saveAmt">$0</b><small>HKD / 365 days</small></div>
    </div>
    <div class="pad">
      <h3 id="inTitle">Merchant and rates</h3>
      <div class="grid">
        <label>Merchant<input id="merchant"/></label>
        <label>Daily card GMV<input id="gmv" type="number" value="10000"/></label>
        <label>Local card %<input id="localRatio" type="number" value="70"/></label>
        <label>Overseas %<input id="overRatio" value="30.00%" readonly/></label>
      </div>
      <div class="grid g2">
        <label>Sales name<input id="salesName"/></label>
        <label>Sales contact<input id="salesContact"/></label>
      </div>
      <table>
        <thead><tr><th>Plan</th><th>OpenRice %</th><th>Current local %</th></tr></thead>
        <tbody>
          <tr><td><label style="flex-direction:row;color:#1f2933"><input type="checkbox" id="selSME" checked/> SME</label></td><td><input id="orSME" type="number" step="0.01" value="1.6"/></td><td><input id="locSME" type="number" step="0.01" value="1.3"/></td></tr>
          <tr><td><label style="flex-direction:row;color:#1f2933"><input type="checkbox" id="selDine" checked/> Dine-in</label></td><td><input id="orDine" type="number" step="0.01" value="2.1"/></td><td><input id="locDine" type="number" step="0.01" value="2.2"/></td></tr>
          <tr><td><label style="flex-direction:row;color:#1f2933"><input type="checkbox" id="selFast" checked/> Fast Food</label></td><td><input id="orFast" type="number" step="0.01" value="1.8"/></td><td><input id="locFast" type="number" step="0.01" value="1.3"/></td></tr>
        </tbody>
      </table>
      <div class="grid g2" style="margin-top:12px">
        <label>Current overseas %<input id="overseaRate" type="number" step="0.01" value="3"/></label>
        <p id="formula" style="color:#647083;font-size:12px">Blended = local rate x local mix + overseas rate x overseas mix</p>
      </div>
    </div>
    <div class="pad" style="border-top:1px solid #d9dee8">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
        <h3 id="outTitle" style="margin:0">Cost saving</h3>
        <button class="btn" id="pdfBtn" type="button">Export PDF</button>
      </div>
      <div id="summary" style="margin:14px 0"></div>
      <div id="cards"></div>
    </div>
    <div class="note" id="note"></div>
  </div>
</div>
<script>
(function(){
  var zh = true;
  function num(id){ return Number(document.getElementById(id).value || 0); }
  function val(id){ return document.getElementById(id).value || ""; }
  function money(v, d){ d = d == null ? 2 : d; return Number(v||0).toLocaleString("en-HK",{minimumFractionDigits:d,maximumFractionDigits:d}); }
  function plans(){
    return [
      {name: zh ? "SME plan" : "SME Plan", on: document.getElementById("selSME").checked, or: num("orSME"), loc: num("locSME")},
      {name: zh ? "Dine-in plan" : "Dine-in Plan", on: document.getElementById("selDine").checked, or: num("orDine"), loc: num("locDine")},
      {name: zh ? "Fast Food plan" : "Fast Food Plan", on: document.getElementById("selFast").checked, or: num("orFast"), loc: num("locFast")}
    ];
  }
  function calc(){
    var local = Math.max(0, Math.min(100, num("localRatio")));
    var over = Math.max(0, 100 - local);
    var gmv = num("gmv");
    var ovRate = num("overseaRate");
    document.getElementById("overRatio").value = over.toFixed(2) + "%";
    var out = [];
    plans().forEach(function(p){
      if(!p.on) return;
      var ls = local/100, os = over/100;
      var daily = gmv * (p.or/100);
      var cDaily = gmv*ls*(p.loc/100) + gmv*os*(ovRate/100);
      var blended = p.loc*ls + ovRate*os;
      out.push({name:p.name, or:p.or, loc:p.loc, ov:ovRate, local:local, over:over, blended:blended, gap:blended-p.or, daily:daily, annual:daily*365, cDaily:cDaily, cAnnual:cDaily*365, save:(cDaily-daily)*365});
    });
    return out;
  }
  function t(a,b){ return zh ? a : b; }
  function render(){
    document.getElementById("langBtn").textContent = zh ? "ENG" : "ZH";
    document.getElementById("title").textContent = t("OpenRice Pay quotation","Payment Solution Quotation");
    document.getElementById("heroTitle").textContent = t("Rate comparison","Payment rate comparison");
    document.getElementById("heroDesc").textContent = t("Compare OpenRice rate vs current provider blended rate.","Compare OpenRice proposed rate with current provider blended rate.");
    document.getElementById("inTitle").textContent = t("Merchant and rates","Merchant details and rates");
    document.getElementById("outTitle").textContent = (val("merchant") || t("Customer","Merchant")) + t(" cost saving"," cost saving");
    document.getElementById("pdfBtn").textContent = t("Export PDF","Export PDF");
    document.getElementById("formula").textContent = t("Blended = local rate x local mix + overseas rate x overseas mix","Blended = local rate x local mix + overseas rate x overseas mix");
    document.getElementById("note").textContent = t("Estimate only. Final rates follow the signed agreement.","Estimate only. Final rates follow the signed agreement.");
    document.getElementById("saveLabel").textContent = t("Annual saving","Estimated annual saving");
    var date = new Intl.DateTimeFormat("en-GB", {year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
    document.getElementById("metaDate").textContent = "DATE " + date;
    document.getElementById("metaSales").textContent = "Sales " + (val("salesName") || "-");
    var rows = calc();
    var best = 0;
    if(rows[0]) best = rows.reduce(function(a,b){ return b.save>a?b.save:a; }, rows[0].save);
    document.getElementById("saveAmt").textContent = "$" + money(best, 0);
    document.getElementById("saveBox").className = "box" + (best >= 0 ? "" : " bad");
    if(rows[0]){
      document.getElementById("path").textContent = rows[0].or.toFixed(2) + "% -> " + rows[0].blended.toFixed(2) + "% -> $" + money(best,0);
      document.getElementById("summary").innerHTML = "<div style='display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #d9dee8'>" +
        "<div style='padding:12px'><div style='font-size:11px;color:#647083'>OpenRice</div><b>" + rows[0].or.toFixed(2) + "%</b></div>" +
        "<div style='padding:12px'><div style='font-size:11px;color:#647083'>Current</div><b>" + rows[0].blended.toFixed(2) + "%</b></div>" +
        "<div style='padding:12px'><div style='font-size:11px;color:#647083'>Gap</div><b>" + Math.abs(rows[0].gap).toFixed(2) + " pts</b></div>" +
        "<div style='padding:12px;background:#e5f2eb'><div style='font-size:11px;color:#2c7a55'>Saving</div><b class='save'>$" + money(rows[0].save,0) + "</b></div></div>";
    } else {
      document.getElementById("path").textContent = "";
      document.getElementById("summary").innerHTML = "";
    }
    var html = "";
    rows.forEach(function(r, i){
      html += "<div class='card'><h3>0" + (i+1) + " " + r.name + " | GMV $" + money(num("gmv"),0) + "</h3>" +
        "<table><thead><tr><th></th><th>OpenRice</th><th>Current</th></tr></thead><tbody>" +
        "<tr><td>Rate</td><td class='or'>" + r.or.toFixed(2) + "%</td><td>" + r.blended.toFixed(2) + "%<br><small>Local " + r.loc.toFixed(2) + "% x " + r.local.toFixed(2) + "% / OS " + r.ov.toFixed(2) + "% x " + r.over.toFixed(2) + "%</small></td></tr>" +
        "<tr><td>Daily</td><td class='or'>$" + money(r.daily) + "</td><td>$" + money(r.cDaily) + "</td></tr>" +
        "<tr><td>Annual</td><td class='or'>$" + money(r.annual) + "</td><td>$" + money(r.cAnnual) + "</td></tr>" +
        "<tr><td>Saving</td><td class='or'><span class='save'>$" + money(r.save) + "</span></td><td></td></tr>" +
        "</tbody></table></div>";
    });
    document.getElementById("cards").innerHTML = html || "<p>Select at least one plan</p>";
  }
  document.getElementById("langBtn").onclick = function(){ zh = !zh; render(); };
  ["gmv","localRatio","overseaRate","orSME","locSME","orDine","locDine","orFast","locFast"].forEach(function(id){ document.getElementById(id).oninput = render; });
  ["selSME","selDine","selFast"].forEach(function(id){ document.getElementById(id).onchange = render; });
  ["merchant","salesName","salesContact"].forEach(function(id){ document.getElementById(id).oninput = render; });
  document.getElementById("pdfBtn").onclick = function(){
    var node = document.getElementById("sheet");
    if (typeof html2pdf !== "function") { window.print(); return; }
    html2pdf().set({margin:[0.35,0.35],filename:"OpenRice_Quotation_" + (val("merchant") || "Merchant") + ".pdf",html2canvas:{scale:2},jsPDF:{unit:"in",format:"a4",orientation:"portrait"}}).from(node).save();
  };
  render();
})();
</script>
</body>
</html>
