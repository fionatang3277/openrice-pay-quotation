<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>OpenRice Pay · Quotation</title>
<link rel="icon" type="image/png" href="./openrice-pay-logo.png"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--ink:#202a63;--ink-strong:#141a43;--accent:#c64b3c;--accent-soft:#f8e8e4;--success:#2c7a55;--success-soft:#e5f2eb;--paper:#fff;--canvas:#edf0f5;--soft:#f5f6f9;--line:#d9dee8;--muted:#647083}
*{box-sizing:border-box}html{background:#eef0f4}body{margin:0;font-family:IBM Plex Sans,sans-serif;color:#1f2933}
button,input{font:inherit}button{cursor:pointer}
.app-shell{min-height:100vh;padding:24px;background:var(--canvas)}.page-wrap{max-width:1220px;margin:0 auto}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand-lockup{display:flex;align-items:center;gap:12px}.brand-mark{width:116px;height:52px;object-fit:contain}
.eyebrow,.micro-label{margin:0 0 7px;font-size:10px;letter-spacing:.17em;font-weight:700;color:var(--accent)}
.language-toggle{min-width:72px;padding:9px 16px;border:1px solid var(--ink);background:#fff;font-size:12px;font-weight:700}
.quotation-sheet{position:relative;border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:0 20px 50px rgba(25,37,77,.13);overflow:hidden}
.quotation-sheet:before{content:"";position:absolute;left:0;top:0;width:9px;height:100%;background:var(--ink)}
.proposal-header{display:flex;justify-content:space-between;gap:24px;padding:40px 48px 28px;border-bottom:1px solid var(--line)}
.proposal-brand{display:flex;gap:16px}.brand-symbol{width:132px;height:60px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px}
.brand-symbol img{width:122px;height:52px;object-fit:contain}
.proposal-brand h1{margin:0;color:var(--ink-strong);font-size:clamp(24px,3vw,36px)}
.subhead{margin:8px 0 0;color:var(--muted);font-size:12px}
.quote-meta{min-width:200px;text-align:right;color:var(--muted);font-size:11px}
.quote-word{color:var(--accent);font-size:24px;font-weight:700}
.hero-grid{display:grid;grid-template-columns:1fr 260px;gap:32px;padding:28px 48px;background:var(--soft)}
.hero-copy h2{margin:0;font-size:clamp(24px,3vw,40px)}
.hero-description{color:var(--muted);font-size:14px;line-height:1.7}
.proof-path{display:flex;gap:12px;align-items:center;margin-top:16px;font-size:20px}
.proof-path small{display:block;color:var(--muted);font-size:9px}
.positive{color:var(--success)}.negative{color:var(--accent)}
.saving-callout{padding:20px;color:#fff;background:var(--success)}.saving-callout.negative{background:var(--accent)}
.saving-callout strong{display:block;font-size:36px;margin:6px 0}
.input-section,.results-section{padding:28px 48px}.input-section{border-top:1px solid var(--line);background:#f7f8fb}
.section-heading{display:flex;justify-content:space-between;gap:16px;margin-bottom:16px}
.input-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.input-grid-2{grid-template-columns:1fr 1fr;margin-top:12px}
.field{display:flex;flex-direction:column;gap:6px}.field span{color:var(--muted);font-size:11px}
.field input,.rate-table input{width:100%;border:1px solid var(--line);padding:10px}
.rate-table-wrap{margin-top:20px;border:1px solid var(--line)}.rate-table{width:100%;border-collapse:collapse}
.rate-table th{background:var(--ink);color:#fff;padding:10px;text-align:left;font-size:11px}
.rate-table td{padding:8px 10px;border-bottom:1px solid var(--line)}
.export-button{border:0;padding:12px 16px;background:var(--accent);color:#fff;font-weight:700}
.summary-metrics{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line)}
.summary-metric{padding:14px;border-right:1px solid var(--line)}.summary-saving{background:var(--success-soft)}
.insight-strip{margin:16px 0;padding:12px;background:var(--accent-soft);border-left:3px solid var(--accent);font-size:12px}
.comparison-table{width:100%;min-width:640px;border-collapse:collapse}
.comparison-table th,.comparison-table td{padding:12px;border:1px solid var(--line);text-align:left}
.comparison-table thead th{background:var(--ink);color:#fff}.preferred-head{background:var(--accent)!important}
.preferred-cell{background:#fdf6f4}.saving-number{color:var(--success);font-size:24px}
.result-card{border:1px solid var(--line);margin-bottom:14px}.result-card-head{padding:12px;background:#f7f8fb;display:flex;justify-content:space-between}
.proposal-footer{display:flex;justify-content:space-between;padding:16px 48px;color:var(--muted);font-size:10px;border-top:1px solid var(--line)}
@media(max-width:800px){.hero-grid,.input-grid,.summary-metrics{grid-template-columns:1fr}.proposal-header{flex-direction:column}}
@media print{.no-print,.input-section{display:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const LOGO="./openrice-pay-logo.png";
const CATS=["SME","Dine-in","Fast Food"];
const labels={zh:{SME:"\u4e2d\u5c0f\u4f01\u65b9\u6848","Dine-in":"\u5802\u98df\u65b9\u6848","Fast Food":"\u5feb\u9910\u65b9\u6848"},en:{SME:"SME Plan","Dine-in":"Dine-in Plan","Fast Food":"Fast Food Plan"}};
const S={language:new URLSearchParams(location.search).get("lang")==="en"?"en":"zh",merchant:"",salesName:"",salesContact:"",gmv:10000,localRatio:70,overseaRate:3,selected:{SME:true,"Dine-in":true,"Fast Food":true},rates:{SME:{proposed:1.6,local:1.3},"Dine-in":{proposed:2.1,local:2.2},"Fast Food":{proposed:1.8,local:1.3}}};
const money=(v,d=2)=>Number(v||0).toLocaleString("en-HK",{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&","<":"<",">":">","\"":""","'":"&#39;"}[c]));
function compute(){
 const ovR=Math.max(0,Math.min(100,100-Number(S.localRatio||0)));
 return {ovR,results:CATS.filter(c=>S.selected[c]).map(cat=>{
  const r=S.rates[cat],p=+r.proposed||0,loc=+r.local||0,ov=+S.overseaRate||0;
  const ls=Math.max(0,Math.min(100,+S.localRatio||0))/100,os=ovR/100;
  const daily=Number(S.gmv||0)*(p/100);
  const cDaily=Number(S.gmv||0)*ls*(loc/100)+Number(S.gmv||0)*os*(ov/100);
  const blended=loc*ls+ov*os;
  return {category:cat,proposedRate:p,localRate:loc,overseaRate:ov,localRatio:+S.localRatio||0,overseaRatio:ovR,blendedRate:blended,rateGap:blended-p,dailyFee:daily,annualFee:daily*365,competitorDailyFee:cDaily,competitorAnnualFee:cDaily*365,annualSavings:(cDaily-daily)*365};
 })};
}
function exportPdf(){const n=document.getElementById("quotation-sheet");if(!n||typeof html2pdf!=="function"){print();return;}html2pdf().set({margin:[.35,.35],filename:(S.language==="zh"?"OpenRice_quote_":"OpenRice_Quotation_")+(S.merchant||"Merchant")+".pdf",html2canvas:{scale:2},jsPDF:{unit:"in",format:"a4",orientation:"portrait"}}).from(n).save();}
function render(){
 const zh=S.language==="zh";
 const {ovR,results}=compute(); const hero=results[0];
 const heroSaving=results.reduce((b,i)=>i.annualSavings>b?i.annualSavings:b,hero?hero.annualSavings:0);
 const date=new Intl.DateTimeFormat(zh?"zh-HK":"en-GB",{year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
 const L=zh?{
  q:"\u5c08\u696d\u652f\u4ed8\u65b9\u6848\u5831\u50f9",h:"\u65b9\u6848\u8cbb\u7387\u6bd4\u8f03",d:"\u6839\u64da\u6bcf\u65e5\u4fe1\u7528\u5361\u71df\u696d\u984d\u53ca\u5361\u7a2e\u6bd4\u4f8b\u6bd4\u8f03\u8cbb\u7387\u3002",
  or:"OpenRice \u8cbb\u7387",cr:"\u73fe\u6709\u5be6\u969b\u8cbb\u7387",sv:"\u5e74\u5ea6\u7bc0\u7701",in:"\u5546\u5bb6\u8cc7\u6599\u53ca\u8cbb\u7387\u8a2d\u5b9a",ex:"\u532f\u51fa PDF \u5831\u50f9\u55ae",lang:"ENG",prov:"\u73fe\u6709\u652f\u4ed8\u4f9b\u61c9\u5546"
 }:{
  q:"Payment Solution Quotation",h:"Payment rate comparison",d:"Compare OpenRice proposed rate with the current provider blended rate.",
  or:"OpenRice Rate",cr:"Current Actual Rate",sv:"Annual Saving",in:"Merchant Details & Rate Settings",ex:"Export PDF Quotation",lang:"\u4e2d\u6587",prov:"Current Provider"
 };
 const rows=CATS.map(c=>`<tr><td><label><input type=checkbox data-plan="${c}" ${S.selected[c]?"checked":""}> ${esc(labels[S.language][c])}</label></td><td><input type=number step=0.01 data-rate="${c}|proposed" value="${S.rates[c].proposed}"></td><td><input type=number step=0.01 data-rate="${c}|local" value="${S.rates[c].local}"></td></tr>`).join("");
 const cards=results.map((r,i)=>`<article class=result-card><div class=result-card-head><strong>0${i+1} ${esc(labels[S.language][r.category])}</strong><span>GMV $${money(S.gmv,0)}</span></div>
 <div style="overflow:auto"><table class=comparison-table><thead><tr><th></th><th class=preferred-head>OpenRice</th><th>${esc(L.prov)}</th></tr></thead><tbody>
 <tr><th>${zh?"\u6709\u6548\u8cbb\u7387":"Effective rate"}</th><td class=preferred-cell>${r.proposedRate.toFixed(2)}%</td><td>${r.blendedRate.toFixed(2)}%<br><small>${zh?"\u672c\u5730":"Local"} ${r.localRate.toFixed(2)}% x ${r.localRatio.toFixed(2)}% / ${zh?"\u6d77\u5916":"Overseas"} ${r.overseaRate.toFixed(2)}% x ${r.overseaRatio.toFixed(2)}%</small></td></tr>
 <tr><th>${zh?"\u6bcf\u65e5\u624b\u7e8c\u8cbb":"Daily fee"}</th><td class=preferred-cell>$${money(r.dailyFee)}</td><td>$${money(r.competitorDailyFee)}</td></tr>
 <tr><th>${zh?"\u5e74\u5ea6\u624b\u7e8c\u8cbb":"Annual fee"}</th><td class=preferred-cell>$${money(r.annualFee)}</td><td>$${money(r.competitorAnnualFee)}</td></tr>
 <tr><th>${zh?"\u5e74\u5ea6\u7bc0\u7701":"Annual saving"}</th><td class=preferred-cell><strong class=saving-number>$${money(r.annualSavings)}</strong></td><td></td></tr>
 </tbody></table></div></article>`).join("") || `<p>${zh?"\u8acb\u9078\u64c7\u81f3\u5c11\u4e00\u500b\u65b9\u6848":"Select a plan"}</p>`;
 document.getElementById("app").innerHTML=`<main class=app-shell><div class=page-wrap>
 <header class="topbar no-print"><div class=brand-lockup><img class=brand-mark src="${LOGO}" alt="OpenRice Pay"><div><p class=eyebrow>OPENRICE PAY \u00b7 SALES TOOL</p><strong>Payment Proposal Studio</strong></div></div>
 <button class=language-toggle type=button>${L.lang}</button></header>
 <section id=quotation-sheet class=quotation-sheet>
 <div class=proposal-header><div class=proposal-brand><div class=brand-symbol><img src="${LOGO}" alt=""></div><div><p class=micro-label>OPENRICE PAY</p><h1>${esc(L.q)}</h1><p class=subhead>Professional Payment Solution Quotation</p></div></div>
 <div class=quote-meta><p class=quote-word>QUOTATION</p><p>${zh?"\u65e5\u671f":"DATE"} <span>${esc(date)}</span></p><p>Sales <span>${esc(S.salesName||"\u2014")}</span></p></div></div>
 <div class=hero-grid><div class=hero-copy><p class=eyebrow>${zh?"\u5546\u696d\u652f\u4ed8\u65b9\u6848\u6bd4\u8f03":"COMMERCIAL REVIEW"}</p><h2>${esc(L.h)}</h2><p class=hero-description>${esc(L.d)}</p>
 <div class=proof-path><span><small>${esc(L.or)}</small>${hero?hero.proposedRate.toFixed(2)+"%":"\u2014"}</span><b>\u2192</b><span><small>${esc(L.cr)}</small>${hero?hero.blendedRate.toFixed(2)+"%":"\u2014"}</span><b>\u2192</b><span class="${heroSaving>=0?"positive":"negative"}"><small>${esc(L.sv)}</small>$${money(heroSaving,0)}</span></div></div>
 <div class="saving-callout ${heroSaving>=0?"positive":"negative"}"><span>${esc(L.sv)}</span><strong>$${money(heroSaving,0)}</strong><small>HKD \u00b7 365 ${zh?"\u65e5":"days"}</small></div></div>
 <section class="input-section no-print"><h3>${esc(L.in)}</h3>
 <div class=input-grid>
 <label class=field><span>${zh?"\u5546\u5bb6\u540d\u7a31":"Merchant"}</span><input id=merchant value="${esc(S.merchant)}"></label>
 <label class=field><span>${zh?"\u6bcf\u65e5\u4fe1\u7528\u5361\u71df\u696d\u984d":"Daily card GMV"}</span><input id=gmv type=number value="${S.gmv}"></label>
 <label class=field><span>${zh?"\u672c\u5730\u5361\u6bd4\u4f8b %":"Local card %"}</span><input id=localRatio type=number value="${S.localRatio}"></label>
 <label class=field><span>${zh?"\u6d77\u5916\u5361\u6bd4\u4f8b":"Overseas %"}</span><input value="${ovR.toFixed(2)}%" readonly></label></div>
 <div class="input-grid input-grid-2">
 <label class=field><span>Sales</span><input id=salesName value="${esc(S.salesName)}"></label>
 <label class=field><span>${zh?"\u806f\u7d61":"Contact"}</span><input id=salesContact value="${esc(S.salesContact)}"></label></div>
 <div class=rate-table-wrap><table class=rate-table><thead><tr><th>${zh?"\u65b9\u6848":"Plan"}</th><th>OpenRice %</th><th>${zh?"\u73fe\u6709\u672c\u5730\u5361 %":"Current local %"}</th></tr></thead><tbody>${rows}</tbody></table>
 <div class=input-grid style="margin:12px"><label class=field><span>${zh?"\u73fe\u6709\u6d77\u5916\u5361\u8cbb\u7387 %":"Current overseas %"}</span><input id=overseaRate type=number step=0.01 value="${S.overseaRate}"></label>
 <p style="color:#647083;font-size:12px">${zh?"\u5be6\u969b\u8cbb\u7387 = \u672c\u5730\u5361\u8cbb\u7387 \u00d7 \u672c\u5730\u6bd4\u4f8b + \u6d77\u5916\u5361\u8cbb\u7387 \u00d7 \u6d77\u5916\u6bd4\u4f8b":"Blended = local rate x local mix + overseas rate x overseas mix"}</p></div></div></section>
 <section class=results-section><div class=section-heading><h3>${esc(S.merchant|| (zh?"\u5ba2\u6236":"Merchant"))} ${zh?"\u6210\u672c\u7bc0\u7701\u5206\u6790":"cost saving"}</h3>
 <button class="export-button no-print" id=export-pdf type=button>${esc(L.ex)}</button></div>
 ${hero?`<div class=summary-metrics><div class=summary-metric><span>${L.or}</span><strong>${hero.proposedRate.toFixed(2)}%</strong></div><div class=summary-metric><span>${L.cr}</span><strong>${hero.blendedRate.toFixed(2)}%</strong></div><div class=summary-metric><span>${zh?"\u8cbb\u7387\u5dee":"Gap"}</span><strong>${Math.abs(hero.rateGap).toFixed(2)} pts</strong></div><div class="summary-metric summary-saving"><span>${L.sv}</span><strong>$${money(hero.annualSavings,0)}</strong></div></div>`:""}
 <div class=insight-strip>${zh?"OpenRice \u4ee5\u7d71\u4e00\u8cbb\u7387\u8655\u7406\u672c\u5730\u53ca\u6d77\u5916\u5361\uff1b\u73fe\u6709\u4f9b\u61c9\u5546\u6309\u5361\u7a2e\u6bd4\u4f8b\u8a08\u7b97\u5be6\u969b\u6210\u672c\u3002":"OpenRice uses one rate for local and overseas cards; the current provider blends by mix."}</div>
 ${cards}
 </section>
 <footer class=proposal-footer><p>${zh?"\u5099\u8a3b\uff1a\u4ee5\u4e0a\u70ba\u4f30\u7b97\uff0c\u6700\u7d42\u4ee5\u6b63\u5f0f\u5408\u7d04\u70ba\u6e96\u3002":"Estimate only. Final rates follow the signed agreement."}</p><p>OpenRice Pay</p></footer>
 </section></div></main>`;
 document.querySelector(".language-toggle").onclick=()=>{S.language=S.language==="zh"?"en":"zh";render();};
 ["merchant","salesName","salesContact"].forEach(id=>{const el=document.getElementById(id);if(el)el.oninput=()=>{S[id]=el.value;};});
 ["gmv","localRatio","overseaRate"].forEach(id=>{const el=document.getElementById(id);if(el)el.oninput=()=>{S[id]=Number(el.value);render();};});
 document.querySelectorAll("[data-plan]").forEach(cb=>cb.onchange=()=>{S.selected[cb.dataset.plan]=cb.checked;render();});
 document.querySelectorAll("[data-rate]").forEach(inp=>inp.oninput=()=>{const[c,f]=inp.dataset.rate.split("|");S.rates[c][f]=Number(inp.value);render();});
 document.getElementById("export-pdf").onclick=exportPdf;
}
render();
</script>
</body>
</html>
