<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>OpenRice Pay Quotation</title>
<link rel="icon" type="image/png" href="./openrice-pay-logo.png"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#eef0f4;font-family:IBM Plex Sans,sans-serif;color:#1f2933}
button,input{font:inherit}button{cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{height:40px}.lang{padding:8px 14px;border:1px solid #202a63;background:#fff;font-weight:700}
.sheet{background:#fff;border:1px solid #d9dee8}
.head-table,.hero-table,.metric-table,.cmp,.grid4,.rate{width:100%;border-collapse:collapse}
.head-table td{padding:20px 24px;vertical-align:top}
.h1{margin:0;font-size:26px;color:#141a43}.qword{color:#c64b3c;font-size:20px;font-weight:700;text-align:right}
.meta{color:#647083;font-size:12px;text-align:right}
.hero-table td{padding:18px 24px;background:#f5f6f9;vertical-align:top}
.hero-table td.savebox{width:220px;background:#2c7a55;color:#fff;padding:16px}
.hero-table td.savebox.bad{background:#c64b3c;color:#fff}
.hero-table td.savebox span,.hero-table td.savebox b,.hero-table td.savebox small{color:#fff}
.savebox b{display:block;font-size:28px;margin:6px 0}
.pad{padding:18px 24px}.grid4 td{padding:4px 6px 10px 0;vertical-align:top;width:25%}
label{display:block;font-size:12px;color:#647083}input{width:100%;padding:8px;border:1px solid #d9dee8}
.rate th,.cmp th{background:#202a63;color:#fff;text-align:left;padding:8px}
.rate td,.cmp td{padding:8px;border:1px solid #d9dee8;vertical-align:top}
.btn{border:0;background:#c64b3c;color:#fff;padding:10px 14px;font-weight:700}
.metric-table td{border:1px solid #d9dee8;padding:10px;width:25%}.metric-table .ok{background:#e5f2eb}
.card{border:1px solid #d9dee8;margin-top:12px;page-break-inside:avoid}.card h3{margin:0;padding:8px 12px;background:#f7f8fb;font-size:14px}
.or{background:#fdf6f4}.save{color:#2c7a55;font-size:20px;font-weight:700}
.note{padding:12px 24px;color:#647083;font-size:11px;border-top:1px solid #d9dee8}
body.pdf-mode .bar,body.pdf-mode #inputPad,body.pdf-mode #pdfBtn{display:none!important}
body.pdf-mode{background:#fff}body.pdf-mode .wrap{max-width:none;padding:0}body.pdf-mode .sheet{border:0}
@media print{.bar,#inputPad,#pdfBtn{display:none!important}body{background:#fff}.wrap{padding:0;max-width:none}.sheet{border:0}@page{size:A4;margin:12mm}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><img class="logo" src="./openrice-pay-logo.png" alt="OpenRice Pay"/><button class="lang" id="langBtn" type="button">ENG</button></div>
  <div class="sheet" id="sheet">
    <table class="head-table"><tr><td><div style="color:#c64b3c;font-size:11px;letter-spacing:.16em;font-weight:700">OPENRICE PAY</div><h1 class="h1" id="title">OpenRice Pay quotation</h1></td><td style="width:220px"><div class="qword">QUOTATION</div><div class="meta" id="metaDate"></div><div class="meta" id="metaSales"></div></td></tr></table>
    <table class="hero-table"><tr><td><h2 id="heroTitle" style="margin:0 0 8px">Rate comparison</h2><p id="heroDesc" style="color:#647083;margin:0 0 10px"></p><div id="path"></div></td><td class="savebox" id="saveBox"><span id="saveLabel">Annual saving</span><b id="saveAmt">$0</b><small>HKD / 365 days</small></td></tr></table>
    <div class="pad" id="inputPad">
      <h3 id="inTitle">Merchant and rates</h3>
      <table class="grid4"><tr><td><label id="lbMerchant">Merchant</label><input id="merchant"/></td><td><label id="lbGmv">Daily card GMV</label><input id="gmv" type="number" value="10000"/></td><td><label id="lbLocal">Local card %</label><input id="localRatio" type="number" value="70"/></td><td><label id="lbOver">Overseas %</label><input id="overRatio" value="30.00%" readonly/></td></tr><tr><td colspan="2"><label>Sales</label><input id="salesName"/></td><td colspan="2"><label id="lbContact">Contact</label><input id="salesContact"/></td></tr></table>
      <table class="rate"><thead><tr><th id="thPlan">Plan</th><th>OpenRice %</th><th id="thLocal">Current local %</th></tr></thead><tbody>
        <tr><td><label><input type="checkbox" id="selSME" checked/> <span id="nSME">SME</span></label></td><td><input id="orSME" type="number" step="0.01" value="1.6"/></td><td><input id="locSME" type="number" step="0.01" value="1.3"/></td></tr>
        <tr><td><label><input type="checkbox" id="selDine" checked/> <span id="nDine">Dine-in</span></label></td><td><input id="orDine" type="number" step="0.01" value="2.1"/></td><td><input id="locDine" type="number" step="0.01" value="2.2"/></td></tr>
        <tr><td><label><input type="checkbox" id="selFast" checked/> <span id="nFast">Fast Food</span></label></td><td><input id="orFast" type="number" step="0.01" value="1.8"/></td><td><input id="locFast" type="number" step="0.01" value="1.3"/></td></tr>
      </tbody></table>
      <table class="grid4" style="margin-top:8px"><tr><td><label id="lbOsRate">Current overseas %</label><input id="overseaRate" type="number" step="0.01" value="3"/></td><td colspan="3"><p id="formula" style="color:#647083;font-size:12px"></p></td></tr></table>
    </div>
    <div class="pad"><table style="width:100%;border-collapse:collapse"><tr><td><h3 id="outTitle" style="margin:0">Cost saving</h3></td><td style="text-align:right"><button class="btn" id="pdfBtn" type="button">Export PDF</button></td></tr></table><div id="summary" style="margin:12px 0"></div><div id="cards"></div></div>
    <div class="note" id="note"></div>
  </div>
</div>
<script>
(function(){
  var zh = true;
  function num(id){ return Number(document.getElementById(id).value || 0); }
  function val(id){ return document.getElementById(id).value || ""; }
  function money(v, d){ d = d == null ? 2 : d; return Number(v||0).toLocaleString("en-HK",{minimumFractionDigits:d,maximumFractionDigits:d}); }
  function t(a,b){ return zh ? a : b; }
  function plans(){
    return [
      {name: t("\u4e2d\u5c0f\u4f01\u65b9\u6848","SME Plan"), on: document.getElementById("selSME").checked, or: num("orSME"), loc: num("locSME")},
      {name: t("\u5802\u98df\u65b9\u6848","Dine-in Plan"), on: document.getElementById("selDine").checked, or: num("orDine"), loc: num("locDine")},
      {name: t("\u5feb\u9910\u65b9\u6848","Fast Food Plan"), on: document.getElementById("selFast").checked, or: num("orFast"), loc: num("locFast")}
    ];
  }
  function calc(){
    var local = Math.max(0, Math.min(100, num("localRatio")));
    var over = Math.max(0, 100 - local);
    var gmv = num("gmv"); var ovRate = num("overseaRate");
    document.getElementById("overRatio").value = over.toFixed(2) + "%";
    var out = [];
    plans().forEach(function(p){
      if(!p.on) return;
      var ls = local/100, os = over/100;
      var daily = gmv * (p.or/100);
      var cDaily = gmv*ls*(p.loc/100) + gmv*os*(ovRate/100);
      var blended = p.loc*ls + ovRate*os;
      out.push({name:p.name, or:p.or, loc:p.loc, ov:ovRate, local:local, over:over, blended:blended, gap:blended-p.or, daily:daily, annual:daily*365, cDaily:cDaily, cAnnual:cDaily*365, save:(cDaily-daily)*365});
    });
    return out;
  }
  function render(){
    document.getElementById("langBtn").textContent = zh ? "ENG" : "\u4e2d\u6587";
    document.getElementById("title").textContent = t("\u5c08\u696d\u652f\u4ed8\u65b9\u6848\u5831\u50f9","Payment Solution Quotation");
    document.getElementById("heroTitle").textContent = t("\u65b9\u6848\u8cbb\u7387\u6bd4\u8f03","Payment rate comparison");
    document.getElementById("heroDesc").textContent = t("\u6839\u64da\u6bcf\u65e5\u4fe1\u7528\u5361\u71df\u696d\u984d\u53ca\u5361\u7a2e\u6bd4\u4f8b\uff0c\u6bd4\u8f03 OpenRice \u5efa\u8b70\u8cbb\u7387\u8207\u73fe\u6709\u4f9b\u61c9\u5546\u5be6\u969b\u8cbb\u7387\u3002","Compare OpenRice proposed rate with current provider blended rate.");
    document.getElementById("inTitle").textContent = t("\u5546\u5bb6\u8cc7\u6599\u53ca\u8cbb\u7387\u8a2d\u5b9a","Merchant details and rates");
    document.getElementById("outTitle").textContent = (val("merchant") || t("\u5ba2\u6236","Merchant")) + t(" \u6210\u672c\u7bc0\u7701\u5206\u6790"," cost saving");
    document.getElementById("pdfBtn").textContent = t("\u532f\u51fa PDF","Export PDF");
    document.getElementById("formula").textContent = t("\u5be6\u969b\u8cbb\u7387 = \u672c\u5730\u5361\u8cbb\u7387 x \u672c\u5730\u6bd4\u4f8b + \u6d77\u5916\u5361\u8cbb\u7387 x \u6d77\u5916\u6bd4\u4f8b","Blended = local rate x local mix + overseas rate x overseas mix");
    document.getElementById("note").textContent = t("\u5099\u8a3b\uff1a\u4ee5\u4e0a\u70ba\u4f30\u7b97\uff0c\u6700\u7d42\u8cbb\u7387\u53ca\u689d\u6b3e\u4ee5\u6b63\u5f0f\u5408\u7d04\u70ba\u6e96\u3002","Estimate only. Final rates follow the signed agreement.");
    document.getElementById("saveLabel").textContent = t("\u9810\u8a08\u5e74\u5ea6\u7bc0\u7701","Estimated annual saving");
    document.getElementById("lbMerchant").textContent = t("\u5546\u5bb6","Merchant");
    document.getElementById("lbGmv").textContent = t("\u6bcf\u65e5\u4fe1\u7528\u5361\u71df\u696d\u984d","Daily card GMV");
    document.getElementById("lbLocal").textContent = t("\u672c\u5730\u5361 %","Local card %");
    document.getElementById("lbOver").textContent = t("\u6d77\u5916\u5361 %","Overseas %");
    document.getElementById("lbContact").textContent = t("\u806f\u7d61","Contact");
    document.getElementById("lbOsRate").textContent = t("\u73fe\u6709\u6d77\u5916\u5361\u8cbb\u7387 %","Current overseas %");
    document.getElementById("thPlan").textContent = t("\u65b9\u6848","Plan");
    document.getElementById("thLocal").textContent = t("\u73fe\u6709\u672c\u5730\u5361 %","Current local %");
    document.getElementById("nSME").textContent = t("\u4e2d\u5c0f\u4f01","SME");
    document.getElementById("nDine").textContent = t("\u5802\u98df","Dine-in");
    document.getElementById("nFast").textContent = t("\u5feb\u9910","Fast Food");
    var date = new Intl.DateTimeFormat(zh ? "zh-HK" : "en-GB", {year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
    document.getElementById("metaDate").textContent = t("\u65e5\u671f ","DATE ") + date;
    document.getElementById("metaSales").textContent = "Sales " + (val("salesName") || "-");
    var rows = calc(); var best = 0;
    if(rows[0]) best = rows.reduce(function(a,b){ return b.save>a?b.save:a; }, rows[0].save);
    document.getElementById("saveAmt").textContent = "$" + money(best, 0);
    document.getElementById("saveBox").className = "savebox" + (best >= 0 ? "" : " bad");
    document.getElementById("path").textContent = rows[0] ? (rows[0].or.toFixed(2) + "%  ->  " + rows[0].blended.toFixed(2) + "%  ->  $" + money(best,0)) : "";
    if(rows[0]){
      document.getElementById("summary").innerHTML = "<table class='metric-table'><tr><td>OpenRice<br><b>" + rows[0].or.toFixed(2) + "%</b></td><td>" + t("\u73fe\u6709\u5be6\u969b\u8cbb\u7387","Current") + "<br><b>" + rows[0].blended.toFixed(2) + "%</b></td><td>" + t("\u8cbb\u7387\u5dee","Gap") + "<br><b>" + Math.abs(rows[0].gap).toFixed(2) + " pts</b></td><td class='ok'>" + t("\u5e74\u5ea6\u7bc0\u7701","Saving") + "<br><b class='save'>$" + money(rows[0].save,0) + "</b></td></tr></table>";
    } else document.getElementById("summary").innerHTML = "";
    var html = "";
    rows.forEach(function(r, i){
      html += "<div class='card'><h3>0" + (i+1) + " " + r.name + " | GMV $" + money(num("gmv"),0) + "</h3><table class='cmp'><tr><th></th><th>OpenRice</th><th>" + t("\u73fe\u6709\u4f9b\u61c9\u5546","Current") + "</th></tr><tr><td>" + t("\u6709\u6548\u8cbb\u7387","Rate") + "</td><td class='or'>" + r.or.toFixed(2) + "%</td><td>" + r.blended.toFixed(2) + "%<br><small>" + t("\u672c\u5730","Local") + " " + r.loc.toFixed(2) + "% x " + r.local.toFixed(2) + "% / " + t("\u6d77\u5916","OS") + " " + r.ov.toFixed(2) + "% x " + r.over.toFixed(2) + "%</small></td></tr><tr><td>" + t("\u6bcf\u65e5\u624b\u7e8c\u8cbb","Daily") + "</td><td class='or'>$" + money(r.daily) + "</td><td>$" + money(r.cDaily) + "</td></tr><tr><td>" + t("\u5e74\u5ea6\u624b\u7e8c\u8cbb","Annual") + "</td><td class='or'>$" + money(r.annual) + "</td><td>$" + money(r.cAnnual) + "</td></tr><tr><td>" + t("\u5e74\u5ea6\u7bc0\u7701","Saving") + "</td><td class='or'><span class='save'>$" + money(r.save) + "</span></td><td></td></tr></table></div>";
    });
    document.getElementById("cards").innerHTML = html || ("<p>" + t("\u8acb\u81f3\u5c11\u9078\u64c7\u4e00\u500b\u65b9\u6848","Select at least one plan") + "</p>");
  }
  function restorePdf(){ document.body.classList.remove("pdf-mode"); }
  document.getElementById("langBtn").onclick = function(){ zh = !zh; render(); };
  ["gmv","localRatio","overseaRate","orSME","locSME","orDine","locDine","orFast","locFast","merchant","salesName","salesContact"].forEach(function(id){ document.getElementById(id).oninput = render; });
  ["selSME","selDine","selFast"].forEach(function(id){ document.getElementById(id).onchange = render; });
  document.getElementById("pdfBtn").onclick = function(){
    var sheet = document.getElementById("sheet");
    document.body.classList.add("pdf-mode");
    window.scrollTo(0,0);
    if (typeof html2pdf !== "function") { window.print(); restorePdf(); return; }
    html2pdf().set({
      margin: [10,10,12,10],
      filename: "OpenRice_Quotation_" + (val("merchant") || "Merchant") + ".pdf",
      image: {type:"jpeg", quality:0.98},
      html2canvas: {scale:2, useCORS:true, backgroundColor:"#ffffff", scrollX:0, scrollY:0},
      jsPDF: {unit:"mm", format:"a4", orientation:"portrait"},
      pagebreak: {mode:["css","legacy"], avoid:[".card",".hero-table",".head-table"]}
    }).from(sheet).save().then(restorePdf).catch(function(){ restorePdf(); window.print(); });
  };
  render();
})();
</script>
</body>
</html>
